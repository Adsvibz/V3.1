name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q -o Blendora*.zip -d proj
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "DIR=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        working-directory: ${{ env.DIR }}
        run: |
          if ! gradle assembleDebug --no-daemon --console=plain > build.log 2>&1; then
            echo "=== ERRORS ==="
            grep "^e:" build.log | head -40
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Blendora-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
